<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wahidayah Falak - Kompas Kiblat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            z-index: -1;
        }

        /* Kompas Ring Utama */
        .compass-container {
            position: relative;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 50px rgba(0,0,0,0.5), inset 0 0 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s linear;
        }

        .compass-ring {
            position: absolute;
            width: 90%;
            height: 90%;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }

        .cardinal-point {
            position: absolute;
            font-weight: 800;
            font-size: 1.2rem;
            color: rgba(255,255,255,0.4);
        }

        .needle-qibla {
            position: absolute;
            width: 4px;
            height: 140px;
            background: linear-gradient(to top, transparent 50%, #f59e0b 50%);
            border-radius: 2px;
            z-index: 10;
        }

        .qibla-icon-top {
            position: absolute;
            top: -35px;
            left: 50%;
            transform: translateX(-50%);
            color: #f59e0b;
            filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.8));
            font-size: 1.5rem;
        }

        .current-degree {
            position: absolute;
            bottom: -80px;
            text-align: center;
        }

        /* Tombol Floating untuk Input Manual */
        .fab-menu {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
        }

        .manual-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 2rem;
            z-index: 90;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
        }

        .manual-panel.open {
            transform: translateY(0);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Animasi */
        @keyframes pulse-gold {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .active-pulse {
            animation: pulse-gold 2s infinite;
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <!-- Header -->
    <div class="fixed top-10 text-center">
        <h1 class="text-2xl font-bold tracking-widest uppercase opacity-80">Wahidayah Falak</h1>
        <div id="location-status" class="status-badge bg-amber-500/20 text-amber-500 mt-2">
            <i class="fa-solid fa-location-dot mr-1"></i> Mencari Lokasi...
        </div>
    </div>

    <!-- Kompas Utama -->
    <div class="relative">
        <div class="compass-container" id="compass">
            <div class="compass-ring"></div>
            
            <!-- Mata Angin -->
            <span class="cardinal-point" style="top: 10px;">U</span>
            <span class="cardinal-point" style="bottom: 10px;">S</span>
            <span class="cardinal-point" style="right: 10px;">T</span>
            <span class="cardinal-point" style="left: 10px;">B</span>

            <!-- Jarum Kiblat -->
            <div id="qibla-pointer" class="needle-qibla" style="transform: rotate(0deg); display: none;">
                <div class="qibla-icon-top">
                    <i class="fa-solid fa-kaaba"></i>
                </div>
            </div>

            <!-- Pusat Kompas -->
            <div class="w-4 h-4 bg-white rounded-full shadow-lg z-20 border-2 border-slate-800"></div>
        </div>

        <div class="current-degree">
            <div class="text-5xl font-black text-white" id="deg-display">0°</div>
            <div class="text-amber-500 font-bold tracking-widest mt-1 uppercase text-sm" id="qibla-label">Menghitung...</div>
        </div>
    </div>

    <!-- Info Box -->
    <div class="fixed bottom-32 px-10 text-center opacity-40 text-xs leading-relaxed max-w-sm">
        Pegang perangkat sejajar dengan lantai. Arahkan ikon Ka'bah tepat ke atas untuk menemukan kiblat.
    </div>

    <!-- Tombol Menu Manual -->
    <button onclick="toggleManual()" class="fab-menu w-14 h-14 bg-amber-500 rounded-full shadow-xl flex items-center justify-center text-slate-900 transition-transform active:scale-90">
        <i class="fa-solid fa-sliders text-xl"></i>
    </button>

    <!-- Panel Manual -->
    <div id="manual-panel" class="manual-panel">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-bold text-lg">Input Lokasi Manual</h3>
            <button onclick="toggleManual()" class="text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div class="space-y-2">
                <label class="text-[10px] uppercase font-bold text-slate-500">Lintang (Lat)</label>
                <input type="number" id="manual-lat" step="any" placeholder="-6.175" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-amber-500">
            </div>
            <div class="space-y-2">
                <label class="text-[10px] uppercase font-bold text-slate-500">Bujur (Lng)</label>
                <input type="number" id="manual-lng" step="any" placeholder="106.827" class="w-full bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-amber-500">
            </div>
        </div>
        <button onclick="applyManual()" class="w-full bg-amber-500 text-slate-900 font-bold py-4 rounded-xl mt-6 shadow-lg shadow-amber-500/20">
            Terapkan & Hitung
        </button>
    </div>

    <script>
        const KABAH_LAT = 21.422487;
        const KABAH_LNG = 39.826206;
        let userLat = null;
        let userLng = null;
        let qiblaAngle = 0;

        function toRad(deg) { return deg * (Math.PI / 180); }
        function toDeg(rad) { return rad * (180 / Math.PI); }

        function toggleManual() {
            document.getElementById('manual-panel').classList.toggle('open');
        }

        function calculate(lat, lng) {
            const phi1 = toRad(lat);
            const L1 = toRad(lng);
            const phi2 = toRad(KABAH_LAT);
            const L2 = toRad(KABAH_LNG);

            const dL = L2 - L1;
            const y = Math.sin(dL);
            const x = Math.cos(phi1) * Math.tan(phi2) - Math.sin(phi1) * Math.cos(dL);
            
            qiblaAngle = toDeg(Math.atan2(y, x));
            if (qiblaAngle < 0) qiblaAngle += 360;

            document.getElementById('deg-display').innerText = Math.round(qiblaAngle) + "°";
            document.getElementById('qibla-label').innerText = "Sudut Kiblat";
            document.getElementById('qibla-pointer').style.display = 'block';
            document.getElementById('qibla-pointer').style.transform = `rotate(${qiblaAngle}deg)`;
            
            const status = document.getElementById('location-status');
            status.innerHTML = '<i class="fa-solid fa-check-circle mr-1"></i> Lokasi Aktif';
            status.classList.replace('bg-amber-500/20', 'bg-emerald-500/20');
            status.classList.replace('text-amber-500', 'text-emerald-500');
        }

        function applyManual() {
            const lat = parseFloat(document.getElementById('manual-lat').value);
            const lng = parseFloat(document.getElementById('manual-lng').value);
            if(!isNaN(lat) && !isNaN(lng)) {
                calculate(lat, lng);
                toggleManual();
            }
        }

        // Memulai Pencarian GPS saat Load
        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLat = pos.coords.latitude;
                        userLng = pos.coords.longitude;
                        calculate(userLat, userLng);
                    },
                    (err) => {
                        const status = document.getElementById('location-status');
                        status.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-1"></i> GPS Mati';
                        status.classList.replace('bg-amber-500/20', 'bg-red-500/20');
                        status.classList.replace('text-amber-500', 'text-red-500');
                        document.getElementById('qibla-label').innerText = "Gunakan Input Manual";
                    }
                );
            }
        };

        // Deteksi Orientasi Kompas (Jika perangkat mendukung)
        // Catatan: Di browser desktop ini tidak akan berputar secara fisik, 
        // tapi di HP dengan sensor magnetik/gyroscope, kompas akan merespon orientasi HP.
        window.addEventListener('deviceorientationabsolute', function(event) {
            let heading = event.alpha || event.webkitCompassHeading;
            if (heading !== undefined) {
                // Kita putar kontainer kompas berlawanan dengan arah hadap HP
                document.getElementById('compass').style.transform = `rotate(${-heading}deg)`;
            }
        }, true);
    </script>
</body>
</html>
